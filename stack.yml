version: "3.8"

services:
  pgalejandro:
    # 1. Usamos la imagen del registro (esto estaba bien)
    image: 127.0.0.1:5001/pgmaldonado:1.0.1
    
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.pgmaldonado.entrypoints=http"
        - "traefik.http.routers.pgmaldonado.rule=Host(`pgmaldonado.byronrm.com`)"
        - "traefik.http.middlewares.pgmaldonado-httpsal.redirectscheme.scheme=https" # Corregí un typo aquí
        - "traefik.http.routers.pgmaldonado.middlewares=pgmaldonado-httpsal" # Corregí un typo aquí
        - "traefik.http.routers.pgmaldonado-secure.entrypoints=https"
        - "traefik.http.routers.pgmaldonado-secure.rule=Host(`pgmaldonado.byronrm.com`)"
        - "traefik.http.routers.pgmaldonado-secure.tls=true"
        - "traefik.http.routers.pgmaldonado-secure.tls.certresolver=http"
        - "traefik.http.routers.pgmaldonado-secure.service=pgmaldonado"
        - "traefik.http.services.pgmaldonado.loadbalancer.server.port=80"
        
        # 2. CORRECCIÓN: Usar la red 'traefik-public' (la original)
        - "traefik.docker.network=traefik-public"
        
    networks:
      # 3. CORRECCIÓN: Conectar el servicio a esa misma red
      - traefik-public

networks:
  # 4. CORRECCIÓN: Definir la red 'traefik-public' como externa
  traefik-public:
    external: true
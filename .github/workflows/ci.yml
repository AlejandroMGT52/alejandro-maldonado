name: CI/CD Flask App

on:
  push:
    branches: ["alejandro_maldonado"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar tests
      run: PYTHONPATH=. pytest -v 

  # --- NUEVO JOB PARA CONSTRUIR Y PUBLICAR LA IMAGEN ---
  build-and-push-image:
    runs-on: ubuntu-latest
    # Este job solo se ejecuta si 'build-and-test' fue exitoso
    needs: build-and-test 
    
    # Permisos necesarios para subir la imagen a GitHub Packages
    permissions:
      contents: read
      packages: write 

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Loguearse a GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          # GITHUB_TOKEN se genera automáticamente por GitHub Actions
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y pushear la imagen
        uses: docker/build-push-action@v4
        with:
          context: . # Usa el Dockerfile en la raíz
          push: true
          # CORRECCIÓN: Usar el nombre del repositorio 'alejandro-maldonado' en el tag.
          tags: ghcr.io/alejandromgt52/alejandro-maldonado:1.0.1
      - name: Pruebas ssh del servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
              echo "Conexión establecida correctamente"
              pwd
              date
              whoami
              hostname
      - name: Pasar el stack.yml al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/automatizar"


      - name: Deploy del servidor 
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
              echo "Deployando los servicios"

              cd ~/automatizar
              
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u alejandromgt52 --password-stdin
              docker pull ghcr.io/alejandromgt52/alejandro-maldonado:1.0.1 

              # Borar el stack quintob
              docker stack rm quintob || true

              # Tiempo de espera hasta que baje los servicios
              sleep 30

              docker stack deploy --with-registry-auth -c stack.yml quintob

              sleep 30
              #Ver los servicios
              docker ps